<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>QuickCall — Video Calls</title>
    <meta name="description" content="Free peer-to-peer video calls directly in your browser. No sign-up required.">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>

    <!-- ================= LOBBY ================= -->
    <div id="lobby" class="screen active">
        <div class="lobby-card">

            <div class="logo">
                <h1>QuickCall</h1>
            </div>

            <p class="subtitle">
                Free peer-to-peer video calls. No sign-up needed.
            </p>

            <div id="status-indicator" class="status connecting">
                <span class="status-dot"></span>
                <span id="status-text">Connecting…</span>
            </div>

            <!-- SHARE LINK -->
            <div id="share-section" class="share-section hidden">
                <label>Share this link to start a call:</label>

                <div class="link-box">
                    <input type="text" id="share-link" readonly>
                    <button id="copy-btn">
                        <span id="copy-text">Copy</span>
                    </button>
                </div>

                <p id="camera-hint" class="camera-hint">
                    Tap below to enable your camera while waiting
                </p>

                <button id="enable-cam-btn" class="btn-secondary">
                    Enable Camera
                </button>
            </div>

            <!-- JOIN -->
            <div id="join-section" class="join-section hidden">
                <p>You are joining a video call.</p>
                <button id="join-btn" class="btn-primary">
                    Join Call
                </button>
            </div>

        </div>
    </div>

    <!-- ================= CALL SCREEN ================= -->
    <div id="call-screen" class="screen">

        <div id="videos-container" class="videos-container">

            <!-- REMOTE VIDEO -->
            <div class="video-wrapper remote-wrapper" id="remote-video-wrapper">
                <video id="remote-video" autoplay playsinline webkit-playsinline preload="auto" disablePictureInPicture
                    controlslist="nodownload noplaybackrate">
                </video>

                <div class="video-label" id="remote-label">
                    Waiting for peer…
                </div>
            </div>

            <!-- LOCAL VIDEO -->
            <div class="video-wrapper local-wrapper" id="local-video-wrapper">
                <video id="local-video" autoplay muted playsinline webkit-playsinline preload="auto"
                    disablePictureInPicture>
                </video>

                <div class="video-label">You</div>
            </div>

        </div>

        <!-- CONTROLS -->
        <div class="controls-bar">

            <button id="mic-btn" class="control-btn active">
                Mic
            </button>

            <button id="cam-btn" class="control-btn active">
                Cam
            </button>

            <button id="switch-cam-btn" class="control-btn">
                Switch
            </button>

            <button id="end-btn" class="control-btn end-call">
                End
            </button>

        </div>
    </div>

    <!-- ================= CALL ENDED ================= -->
    <div id="ended-screen" class="screen">
        <div class="lobby-card">

            <h2 class="ended-title">Call Ended</h2>

            <p id="ended-message" class="ended-subtitle">
                The call has been disconnected.
            </p>

            <button class="btn-primary" onclick="window.location.href = window.location.pathname;">
                Start New Call
            </button>

        </div>
    </div>

</body>

</html>
