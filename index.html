<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>QuickCall — Video Calls</title>
    <meta name="description" content="Free peer-to-peer video calls directly in your browser. No sign-up required.">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>

    <!-- ================= LOBBY ================= -->
    <div id="lobby" class="screen active">
        <div class="lobby-card">

            <div class="logo">
                <h1>QuickCall</h1>
            </div>

            <p class="subtitle">
                Free peer-to-peer video calls. No sign-up needed.
            </p>

            <div id="status-indicator" class="status connecting">
                <span class="status-dot"></span>
                <span id="status-text">Connecting…</span>
            </div>

            <!-- SHARE LINK -->
            <div id="share-section" class="share-section hidden">
                <label>Share this link to start a call:</label>

                <div class="link-box">
                    <input type="text" id="share-link" readonly>
                    <button id="copy-btn">
                        <span id="copy-text">Copy</span>
                    </button>
                </div>

                <p id="camera-hint" class="camera-hint">
                    Tap below to enable your camera while waiting
                </p>

                <button id="enable-cam-btn" class="btn-secondary">
                    Enable Camera
                </button>
            </div>

            <!-- JOIN -->
            <div id="join-section" class="join-section hidden">
                <p>You are joining a video call.</p>
                <button id="join-btn" class="btn-primary">
                    Join Call
                </button>
            </div>

        </div>
    </div>

    <!-- ================= CALL SCREEN ================= -->
    <div id="call-screen" class="screen">

        <div id="videos-container" class="videos-container">

            <!-- REMOTE VIDEO -->
            <div class="video-wrapper remote-wrapper" id="remote-video-wrapper">
                <video id="remote-video" autoplay playsinline webkit-playsinline preload="auto" disablePictureInPicture
                    controlslist="nodownload noplaybackrate">
                </video>

                <div class="video-label" id="remote-label">
                    Waiting for peer…
                </div>
            </div>

            <!-- LOCAL VIDEO -->
            <div class="video-wrapper local-wrapper" id="local-video-wrapper">
                <video id="local-video" autoplay muted playsinline webkit-playsinline preload="auto"
                    disablePictureInPicture>
                </video>

                <div class="video-label">You</div>
            </div>

        </div>

        <!-- CONTROLS -->
        <div class="controls-bar">

            <button id="mic-btn" class="control-btn active" aria-label="Toggle Microphone">
                <span class="icon-on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg></span>
                <span class="icon-off"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="1" y1="1" x2="23" y2="23" />
                        <path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6" />
                        <path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2c0 .76-.13 1.49-.35 2.17" />
                        <line x1="12" y1="19" x2="12" y2="23" />
                        <line x1="8" y1="23" x2="16" y2="23" />
                    </svg></span>
            </button>

            <button id="cam-btn" class="control-btn active" aria-label="Toggle Camera">
                <span class="icon-on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7" />
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2" />
                    </svg></span>
                <span class="icon-off"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16.5 7.5l6.5-4.5v18l-6.5-4.5" />
                        <path d="M2 5h11a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2V5z" />
                        <line x1="1" y1="1" x2="23" y2="23" />
                    </svg></span>
            </button>

            <button id="switch-cam-btn" class="control-btn active" aria-label="Switch Camera">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10" />
                    <polyline points="1 20 1 14 7 14" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                </svg>
            </button>

            <button id="end-btn" class="control-btn end-call" aria-label="End Call">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" />
                    <line x1="23" y1="1" x2="1" y2="23" />
                </svg>
            </button>

        </div>
    </div>

    <!-- ================= CALL ENDED ================= -->
    <div id="ended-screen" class="screen">
        <div class="lobby-card">

            <h2 class="ended-title">Call Ended</h2>

            <p id="ended-message" class="ended-subtitle">
                The call has been disconnected.
            </p>

            <button class="btn-primary" onclick="window.location.href = window.location.pathname;">
                Start New Call
            </button>

        </div>
    </div>

</body>

</html>
